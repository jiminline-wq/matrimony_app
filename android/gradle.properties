# ============================================================
# Gradle JVM args — Metaspace বাড়ানো হয়েছে (ক্র্যাশ প্রতিরোধ)
# ============================================================
org.gradle.jvmargs=-Xms1024m -Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ============================================================
# Gradle daemon & build behaviour
# ============================================================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ============================================================
# Android
# ============================================================
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false

# ============================================================
# Kotlin — নিজস্ব daemon ব্যবহার করবে (in-process নয়)
# এতে Gradle daemon-এর ভার কমে এবং ক্র্যাশ হয় না
# ============================================================
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m