name: matrimony_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # ✅ NEW: AdMob
  google_mobile_ads: ^5.2.0
  
  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  firebase_analytics: ^12.6.0

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  video_player: ^2.9.2
  record: ^7.1.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1


  # Chat / UI
  flutter_card_swiper: ^7.0.1
  intl: ^0.19.0

  # Location
  geoflutterfire_plus: ^0.0.28
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Call
  agora_rtc_engine: ^6.5.2
  flutter_ringtone_player: ^4.0.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Utils
  http: ^1.2.2
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/ringtone.mp3
    - assets/sounds/ringback.mp3

# ============================================================
# APP ICON CONFIG
# ============================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

  # ✅ Adaptive icon (Android 8+)
  adaptive_icon_background: "#8B1E3F"    # আপনার app-এর maroon color
  adaptive_icon_foreground: "assets/app_icon.png"

  # ✅ Optional: Web + Windows
  web:
    generate: true
    image_path: "assets/app_icon.png"